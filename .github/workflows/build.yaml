name: Build and push ostree container

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    container:
      image: quay.io/podman/stable:v5
      options: "--user root --privileged -v /var/tmp:/var/tmp -v /tmp:/tmp"
    strategy:
      matrix:
        release_version:
          - "42"
          - "43"
    steps:
      - uses: actions/checkout@v4
      # https://github.com/actions/checkout/issues/760
      # - name: Mark git checkout as safe
      #   run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Login to registry
        run: podman login --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ github.repository_owner }}
      - name: Build ostree container
        run: |
          branch_tag=$(echo "${{ github.ref_name }}" | tr '/' '-')
          ./build.sh -d ghcr.io/${{ github.repository_owner }} -r ${{ matrix.release_version }} -n "${GITHUB_REPOSITORY,,}" -s "${branch_tag}" -s "${{ github.sha }}"
